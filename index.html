<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Путеводник по играм: время прохождения, настроение, кому зайдёт и похожие игры на одной карточке.">
<title>Путеводник по играм</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<style>
/* Layout: редакционная вёрстка в духе журнала. Гигантское слово-логотип, микро-навигация, подписи с номерами, широкий блок-обложка, строки с тонкими линиями, сетка каталога. Только чёрный и белый, серый появляется лишь как смесь этих двух. */
:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: color-mix(in srgb, var(--fg) 55%, var(--bg));
  --line: color-mix(in srgb, var(--fg) 20%, var(--bg));
  --font: "Onest", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

/* nav */
.nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; font-size: 12px; line-height: 1.35; align-items: start; }
.nav nav { display: flex; flex-direction: column; }
.nav .r { text-align: right; }
.nav a, .nav button { text-decoration: none; }
.nav a:hover, .nav button:hover { text-decoration: underline; text-underline-offset: 3px; }

/* wordmark */
.mark { margin: clamp(28px, 7vw, 72px) 0 clamp(10px, 2vw, 18px); overflow: hidden; }
.mark h1 { margin: 0; font-weight: 800; letter-spacing: -.045em; line-height: 1; white-space: nowrap; font-size: 15vw; }
.mark h1 span { display: inline-block; }
.mark .ch { opacity: 0; transform: translateY(32%); animation: letter .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--n) * 45ms); }
@keyframes letter { to { opacity: 1; transform: none; } }

/* search */
.search { position: relative; display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--fg); padding-bottom: 8px; margin-bottom: 22px; }
.search label { font-size: 12px; flex: none; }
#q { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg); font: inherit; font-weight: 500; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: -.02em; padding: 2px 0; }
#q:focus { outline: none; }
#q::placeholder { color: var(--muted); }
.search:focus-within { border-bottom-width: 2px; margin-bottom: 21px; }
.go { font-size: 12px; flex: none; }
.go:hover { text-decoration: underline; text-underline-offset: 3px; }
.list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; list-style: none; margin: 0; padding: 0; background: var(--bg); border: 1px solid var(--fg); animation: drop .16s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.list li { display: flex; gap: 14px; align-items: baseline; padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list li[aria-selected="true"], .list li:hover { background: var(--fg); color: var(--bg); }
.list .n { font-size: 12px; opacity: .6; width: 28px; flex: none; font-variant-numeric: tabular-nums; }
.list .g { margin-left: auto; font-size: 12px; opacity: .7; white-space: nowrap; }
.list .none { cursor: default; color: var(--muted); }
.list .none:hover { background: transparent; color: var(--muted); }

/* captions + hero */
.caps { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 11px; margin-bottom: 6px; }
.caps div { display: flex; justify-content: space-between; gap: 12px; }
.art { position: relative; isolation: isolate; overflow: hidden; background: var(--bg-art); }
.hero { aspect-ratio: 16 / 7.5; }
.hero.reveal { animation: wipe .9s cubic-bezier(.7,0,.2,1); }
@keyframes wipe { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.art::before { content: ""; position: absolute; inset: -20%; background: repeating-radial-gradient(circle at var(--cx) var(--cy), transparent 0 22px, rgba(255,255,255,.22) 22px 23px); }
.hero.reveal::before { animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.12) translate(-1.5%, 1%); } }
.glyph { position: absolute; left: clamp(14px, 2.4vw, 32px); top: clamp(8px, 1.6vw, 20px); font-weight: 800; letter-spacing: -.05em; line-height: 1; font-size: clamp(54px, 15vw, 190px); color: #fff; mix-blend-mode: difference; }

/* sections */
.sec { margin-top: clamp(40px, 7vw, 88px); }
.lab { font-size: 12px; margin: 0 0 10px; }
.statement { font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-size: clamp(26px, 4.6vw, 54px); margin: 0; max-width: 20ch; text-wrap: balance; }
.about { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: clamp(28px, 5vw, 56px); align-items: end; }
.about .thumb { width: min(190px, 46%); }
.about p { margin: 0; font-size: 13px; max-width: 46ch; padding-left: 22px; position: relative; }
.about p::before { content: ""; position: absolute; left: 0; top: .42em; width: 9px; height: 9px; background: var(--fg); border-radius: 50%; }
.more { display: inline-block; margin-top: 14px; font-weight: 700; font-size: 12px; }
.more:hover { text-decoration: underline; text-underline-offset: 3px; }
.thumb { text-align: left; display: block; }
.thumb .art { aspect-ratio: 4 / 5; }
.thumb small { display: block; font-size: 11px; margin-top: 6px; color: var(--muted); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 72px); }
.rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--fg); }
.rows li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rows .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.bars { display: flex; gap: 4px; }
.bar { width: 28px; height: 6px; background: var(--line); position: relative; overflow: hidden; }
.bar.on::after { content: ""; position: absolute; inset: 0; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 80ms + 250ms); }
.in .bar.on::after { transform: scaleX(1); }

.sims { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
.sims button { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; width: 100%; padding: 16px 0; border-bottom: 1px solid var(--line); transition: padding .25s; }
.sims button:hover { padding-left: 14px; background: var(--fg); color: var(--bg); }
.sims .n { font-size: 12px; opacity: .6; }
.sims b { font-size: clamp(18px, 2.6vw, 28px); letter-spacing: -.02em; font-weight: 700; }
.sims em { font-style: normal; font-size: 13px; color: inherit; opacity: .75; display: block; margin-top: 2px; }
.sims .go2 { font-size: 18px; }

.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.head h2 { margin: 0; font-weight: 800; letter-spacing: -.05em; line-height: .95; font-size: clamp(44px, 9vw, 112px); }
.head span { font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; row-gap: 22px; }
.tile { display: block; width: 100%; }
.tile .art { aspect-ratio: 4 / 5; }
.tile .art::before { transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.tile:hover .art::before { transform: scale(1.25); }
.tile .g2 { position: absolute; left: 10px; top: 8px; font-weight: 800; letter-spacing: -.05em; font-size: clamp(30px, 5vw, 56px); line-height: 1; color: #fff; mix-blend-mode: difference; }
.tile .cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; }
.tile .cap b { font-weight: 500; }
.tile .sub { font-size: 11px; color: var(--muted); }
.tile[aria-current="true"] .cap b { text-decoration: underline; text-underline-offset: 3px; }
.tile.rv { animation: up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--n) * 50ms); }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.empty { border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); padding: 48px 0; }
.empty .statement { max-width: 24ch; }
.empty p { color: var(--muted); max-width: 52ch; margin: 14px 0 0; }

.foot { margin-top: clamp(48px, 8vw, 100px); border-top: 1px solid var(--fg); padding-top: 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; }
.foot p { margin: 0; max-width: 60ch; }

.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); }
.art img.ok { opacity: 1; }
.tile:hover .art img { transform: scale(1.06); }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.shots .art { aspect-ratio: 16 / 10; }
.desc { margin: 18px 0 0; max-width: 70ch; font-size: 14px; }
.src { margin: 14px 0 0; font-size: 11px; color: var(--muted); }
.src a { text-underline-offset: 3px; }
.about.one { grid-template-columns: minmax(0, 1fr); }
.about.one p { max-width: 70ch; }
.list li.head { cursor: default; font-size: 11px; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--line); }
.list li.head:hover { background: transparent; color: var(--muted); }

.lead { margin: 0; max-width: 52ch; font-size: clamp(17px, 2.3vw, 22px); line-height: 1.4; letter-spacing: -.01em; }

.art .glyph, .art .g2 { transition: opacity .5s; }
.art.has-img .glyph, .art.has-img .g2 { opacity: 0; }

.lab.mt { margin-top: 44px; }
.loadmore { display: block; margin: 28px auto 0; font-size: 13px; border: 1px solid var(--fg); border-radius: 999px; padding: 12px 24px; text-align: center; transition: background .2s, color .2s; }
.loadmore:hover { background: var(--fg); color: var(--bg); }

@media (max-width: 820px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols, .about { grid-template-columns: minmax(0, 1fr); }
  .hero { aspect-ratio: 4 / 3.4; }
  .caps { grid-template-columns: 1fr; gap: 2px; }
  .nav { grid-template-columns: 1fr 1fr; }
  .nav nav { grid-column: 1 / -1; order: 3; flex-direction: row; gap: 14px; }
  .sims button { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .mark .ch { opacity: 1; transform: none; }
  .bar.on::after { transform: scaleX(1); }
}
</style>
</head>

  /* ---------- helpers ---------- */

    t = String(t || '').replace(/\s+/g, ' ').trim();

  function pick(results, title) {

  }
  function submit() {
    if (active >= 0 && items[active]) return pickItem(items[active]);
    var text = q.value.trim();
    if (!text) return;
    var found = find(text);
    if (found.length) return select(found[0].id);
    if (remote.status === 'ok' && remote.list.length && remote.q === norm(text)) return pickItem({ kind: 'remote', r: remote.list[0] });
    var token = ++openToken;
    closeList(); current = null; renderGrid(false); markCurrent();
    out.innerHTML = '<section class="sec empty"><p class="lab">( ищу в rawg )</p><h2 class="statement">«' + esc(text) + '»</h2></section>';
    jget('/games', { search: text, page_size: 1 }).then(function (d) {
      if (token !== openToken) return;
      var r = (d.results || [])[0];
      if (r) selectRemote(r.id, r.name); else renderEmpty(text, false);
    }).catch(function () { if (token === openToken) renderEmpty(text, true); });
  }

  /* ---------- catalog from RAWG ---------- */
  var grid2 = document.getElementById('grid2'), loadBtn = document.getElementById('loadMore');
  var cat = { page: 0, loading: false, done: false };
  function markCurrent() {
    [].forEach.call(grid2.querySelectorAll('.rtile'), function (t) {
      if (current && current.id === 'rawg:' + t.getAttribute('data-rid')) t.setAttribute('aria-current', 'true');
      else t.removeAttribute('aria-current');
    });
  }
  function rtile(r, n) {
    var g0 = (r.genres && r.genres[0]) ? r.genres[0].name.toLowerCase() : '';
    return '<button type="button" class="tile rtile rv" style="--n:' + n + '" data-rid="' + r.id + '" data-name="' + esc(r.name) + '">' +
      '<div class="art" style="--bg-art: hsl(0 0% 14%); --cx:50%; --cy:50%"><span class="g2">' + esc(initials(r.name)) + '</span></div>' +
      '<div class="cap"><b>' + esc(r.name) + '</b><span>' + esc(r.released ? r.released.slice(0, 4) : '') + '</span></div><div class="sub">' + esc(g0) + '</div></button>';
  }
  function loadCatalog() {
    if (cat.loading || cat.done) return;
    cat.loading = true; loadBtn.hidden = false; loadBtn.textContent = 'загружаю…';
    jget('/games', { ordering: '-added', page_size: 24, page: cat.page + 1 }).then(function (d) {
      cat.page++;
      var rids = GAMES.map(function (g) { return g.rawg && g.rawg.id; });
      var names = GAMES.map(function (g) { return norm(g.title); });
      var have = {};
      [].forEach.call(grid2.querySelectorAll('.rtile'), function (t) { have[t.getAttribute('data-rid')] = 1; });
      var res = (d.results || []).filter(function (r) {
        return r.background_image && !have[r.id] && rids.indexOf(r.id) === -1 && names.indexOf(norm(r.name)) === -1;
      });
      grid2.insertAdjacentHTML('beforeend', res.map(function (r, i) { return rtile(r, i % 12); }).join(''));
      res.forEach(function (r) {
        putImg(grid2.querySelector('.rtile[data-rid="' + r.id + '"] .art'), sized(r.background_image, 600, 400), r.background_image, true);
      });
      markCurrent();
      if (!d.next) { cat.done = true; loadBtn.hidden = true; } else loadBtn.textContent = 'показать ещё →';
    }).catch(function () { loadBtn.hidden = false; loadBtn.textContent = 'RAWG не отвечает, повторить →'; })
      .then(function () { cat.loading = false; });
  }

  /* ---------- events ---------- */
  q.addEventListener('input', function () { matches = find(q.value); active = -1; remoteSearch(q.value); renderList(); });
  q.addEventListener('focus', function () {
    matches = find(current && q.value === current.title ? '' : q.value);
    remote = { q: '', status: 'idle', list: [] };
    renderList(); q.select();
  });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.hidden) { matches = find(q.value); renderList(); }
      if (!items.length) return;
      active = e.key === 'ArrowDown' ? (active + 1) % items.length : (active - 1 + items.length) % items.length;
      renderList(); q.setAttribute('aria-activedescendant', 'opt' + active);
    } else if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Escape') closeList();
  });
  go.addEventListener('click', submit);
  document.getElementById('focusSearch').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); q.focus(); });
  list.addEventListener('mousedown', function (e) {
    var el = e.target.closest('li[data-i]');
    if (el) { e.preventDefault(); pickItem(items[+el.getAttribute('data-i')]); }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search')) closeList();
    var rt = e.target.closest('.rtile');
    if (rt) { selectRemote(+rt.getAttribute('data-rid'), rt.getAttribute('data-name'), true); return; }
    var b = e.target.closest('button[data-id]');
    if (b) select(b.getAttribute('data-id'), true);
  });
  loadBtn.addEventListener('click', loadCatalog);

  /* ---------- boot ---------- */
  current = BY['tlou'];
  renderGrid(true);
  var bootToken = ++openToken;
  renderCard(current);
  q.value = current.title;
  loadExtra(current, bootToken);
  GAMES.forEach(function (g) { resolve(g).then(function () { applyImg(g); }); });
  loadCatalog();
})();
</script>
</body>
</html>
